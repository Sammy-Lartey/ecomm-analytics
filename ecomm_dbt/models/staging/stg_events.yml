# This file defines the staging models for the e-commerce analytics project, which clean and standardize the raw data from the source tables.
# Each staging model corresponds to a source table and includes transformations to handle missing values, standardize formats, and derive new fields for easier analysis in downstream models.

version: 2

models:
  - name: stg_events
    description: "Cleaned events — 361 null Excel padding rows removed, types cast, region enriched"
    columns:
      - name: event_id
        tests:
          - not_null
          - unique
      - name: event_type
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['order', 'invoice']
      - name: customer_id
        tests:
          - not_null
      - name: product_id
        tests:
          - not_null

  - name: stg_products
    description: "Cleaned product catalog"
    columns:
      - name: product_id
        tests:
          - not_null
          - unique

  - name: stg_customers
    description: "Cleaned customer profiles — region enriched for US and Canada"
    columns:
      - name: customer_id
        tests:
          - not_null
          - unique