# This file defines the source tables for the e-commerce analytics project, providing metadata and documentation for the raw data loaded into the warehouse.

version: 2

sources:
  - name: raw
    database: ecomm_db
    schema: raw
    description: "Raw bronze layer — CSV files loaded directly from S3 via COPY command. No transformations applied."

    tables:
      - name: events
        description: "Raw e-commerce events — orders and invoices. 48,000 rows loaded from events.csv. Contains 361 null padding rows from Excel source — handled in stg_events."
        columns:
          - name: event_id
            description: "Unique event identifier"
          - name: event_type
            description: "Type of event — order or invoice"
          - name: customer_id
            description: "Foreign key to customers table"
          - name: product_id
            description: "Foreign key to products table"

      - name: products
        description: "Raw product catalog. 101 rows loaded from products.csv."
        columns:
          - name: product_id
            description: "Unique product identifier"
            tests:
              - not_null
              - unique

      - name: customers
        description: "Raw customer profiles. 4,000 rows loaded from customers.csv."
        columns:
          - name: customer_id
            description: "Unique customer identifier"
            tests:
              - not_null
              - unique